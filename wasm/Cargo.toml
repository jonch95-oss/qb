[package]
name = "qbw-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "WebAssembly build of the OpenQBW reader for the drag-and-drop QBW viewer"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openqbw = { git = "https://github.com/Sigilweaver/OpenQBW", rev = "e11017e1259f886610b4570215d0e8ea133c103a" }
opensqlany = "0.2.0"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
